name: Android APK - Fluxo de Caixa RF

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-fluxo-caixa.yml'

permissions:
  contents: write

concurrency:
  group: android-fluxo-caixa-native-v1
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Manter assinatura de teste
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: fluxo-caixa-rf-debug-v1
      - name: Verificar interface nativa
        run: |
          ! grep -q 'import android.webkit.WebView' android/app/src/main/java/net/consultoriarf/fluxocaixa/MainActivity.java
          grep -q 'class MainActivity' android/app/src/main/java/net/consultoriarf/fluxocaixa/MainActivity.java
          grep -q 'salvarLancamentoManual' android/app/src/main/java/net/consultoriarf/fluxocaixa/MainActivity.java
          grep -q 'obterConciliacaoBancoV59' android/app/src/main/java/net/consultoriarf/fluxocaixa/MainActivity.java
      - name: Compilar APK
        run: gradle --no-daemon -p android :app:assembleDebug
      - name: Preparar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/FluxoCaixaRF.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: FluxoCaixaRF-APK
          path: ${{ runner.temp }}/FluxoCaixaRF.apk
          retention-days: 90
      - name: Publicar instalador em Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="fluxo-caixa-android-${GITHUB_SHA:0:12}"
          gh release create "$TAG" "$RUNNER_TEMP/FluxoCaixaRF.apk" \
            --title "Fluxo de Caixa RF - Android com widget" \
            --notes "Aplicativo Android completo com widget financeiro compacto. APK de teste assinado."

name: Android APK - Fluxo de Caixa RF

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-fluxo-caixa.yml'

permissions:
  contents: write

concurrency:
  group: android-fluxo-caixa-rf-build-v2
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Manter assinatura de teste
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: fluxo-caixa-rf-debug-v1
      - name: Compilar APK
        run: gradle --no-daemon -p android :app:assembleDebug
      - name: Preparar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/FluxoCaixaRF.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: FluxoCaixaRF-APK
          path: ${{ runner.temp }}/FluxoCaixaRF.apk
          retention-days: 90
      - name: Publicar instalador em Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="fluxo-caixa-android-${GITHUB_SHA:0:12}"
          gh release create "$TAG" "$RUNNER_TEMP/FluxoCaixaRF.apk" \
            --title "Fluxo de Caixa RF - Android com widget" \
            --notes "Aplicativo Android completo com widget financeiro compacto. APK de teste assinado."
      - name: Testar inicializacao no Android (emulador)
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 7
        continue-on-error: true
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          target: google_apis
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n net.consultoriarf.fluxocaixa/.MainActivity
            sleep 12
            echo "==== ERROS AndroidRuntime ===="
            adb logcat -d -s AndroidRuntime:E
            PID="$(adb shell pidof net.consultoriarf.fluxocaixa | tr -d '\r')"
            if [ -z "$PID" ]; then
              echo "::error::O app abriu e fechou. Verifique AndroidRuntime acima."
              exit 1
            fi
            echo "Teste OK: aplicativo continua rodando, PID $PID"

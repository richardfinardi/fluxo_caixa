name: Bootstrap Neosonics API

on:
  push:
    branches:
      - main
    paths:
      - ".deploy-triggers/neosonics-bootstrap.txt"
      - ".github/workflows/bootstrap-neosonics.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout controle de deploy
        uses: actions/checkout@v4

      - name: Checkout Neosonics
        uses: actions/checkout@v4
        with:
          repository: richardfinardi/neosonics
          ref: main
          path: neosonics

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install clasp
        run: npm install -g @google/clasp@3.4.1

      - name: Configurar autorizacao Google
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          test -n "$CLASPRC_JSON" || (echo "Secret CLASPRC_JSON nao configurado no fluxo_caixa" && exit 1)
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"

      - name: Criar ou reutilizar projeto Apps Script
        id: script
        run: |
          mkdir -p .deploy
          if [ -f .deploy/neosonics.env ]; then
            source .deploy/neosonics.env
            echo "Reutilizando Script ID $APPS_SCRIPT_ID"
          else
            mkdir -p /tmp/neosonics-bootstrap
            cd /tmp/neosonics-bootstrap
            clasp create --type standalone --title "NEOSONICS API"
            APPS_SCRIPT_ID=$(node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('.clasp.json','utf8')); process.stdout.write(x.scriptId)")
            cd "$GITHUB_WORKSPACE"
            echo "APPS_SCRIPT_ID=$APPS_SCRIPT_ID" > .deploy/neosonics.env
          fi
          echo "script_id=$APPS_SCRIPT_ID" >> "$GITHUB_OUTPUT"

      - name: Configurar projeto Apps Script
        working-directory: neosonics/apps-script
        env:
          APPS_SCRIPT_ID: ${{ steps.script.outputs.script_id }}
        run: |
          cat > .clasp.json <<EOF
          {
            "scriptId": "$APPS_SCRIPT_ID",
            "rootDir": "",
            "scriptExtensions": [".js", ".gs"],
            "htmlExtensions": [".html"],
            "jsonExtensions": [".json"],
            "filePushOrder": [],
            "skipSubdirectories": false
          }
          EOF

      - name: Enviar backend para Apps Script
        working-directory: neosonics/apps-script
        run: clasp push --force

      - name: Criar ou atualizar deployment
        id: deploy
        working-directory: neosonics/apps-script
        run: |
          source "$GITHUB_WORKSPACE/.deploy/neosonics.env"
          if [ -n "${DEPLOYMENT_ID:-}" ]; then
            clasp update-deployment "$DEPLOYMENT_ID" --description "Deploy automatico Neosonics $GITHUB_SHA"
          else
            OUT=$(clasp deploy --description "Deploy inicial Neosonics $GITHUB_SHA")
            echo "$OUT"
            DEPLOYMENT_ID=$(printf '%s\n' "$OUT" | grep -oE 'AKfycb[A-Za-z0-9_-]+' | head -1)
            test -n "$DEPLOYMENT_ID" || (echo "Nao foi possivel identificar o deployment ID" && exit 1)
            {
              echo "APPS_SCRIPT_ID=$APPS_SCRIPT_ID"
              echo "DEPLOYMENT_ID=$DEPLOYMENT_ID"
              echo "WEBAPP_URL=https://script.google.com/macros/s/$DEPLOYMENT_ID/exec"
            } > "$GITHUB_WORKSPACE/.deploy/neosonics.env"
          fi
          echo "deployment_id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"
          echo "webapp_url=https://script.google.com/macros/s/$DEPLOYMENT_ID/exec" >> "$GITHUB_OUTPUT"

      - name: Validar API publicada
        env:
          WEBAPP_URL: ${{ steps.deploy.outputs.webapp_url }}
        run: |
          echo "Testando $WEBAPP_URL?acao=ping"
          OK=0
          for TENTATIVA in 1 2 3 4 5 6; do
            BODY=$(curl --max-time 20 -L --fail --silent --show-error "$WEBAPP_URL?acao=ping" || true)
            echo "$BODY"
            if echo "$BODY" | grep -q '"ok":true' && echo "$BODY" | grep -q '"NEOSONICS"'; then
              OK=1
              break
            fi
            echo "API ainda nao respondeu corretamente. Tentativa $TENTATIVA/6."
            sleep 5
          done
          test "$OK" = "1"

      - name: Persistir IDs do Neosonics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .deploy/neosonics.env
          if git diff --cached --quiet; then
            echo "IDs ja persistidos."
          else
            git commit -m "Registra Apps Script do Neosonics"
            git push
          fi

      - name: Resumo
        run: |
          cat .deploy/neosonics.env

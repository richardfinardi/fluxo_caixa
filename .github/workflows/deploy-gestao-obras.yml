name: Deploy Gestao Obras

on:
  push:
    branches:
      - main
    paths:
      - ".deploy-triggers/gestao-obras.txt"
      - ".github/workflows/deploy-gestao-obras.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_REPOSITORY: richardfinardi/gestao_obras
  APPS_SCRIPT_ID: 1EMR4UjO1xwYYJIP_lL1hZ2D3ZRqkReqnB326XPoPqjx96o_2zSTAXWIl
  DEPLOYMENT_ID: AKfycbw6cRAPlwVzNOURoLNsTJ47xyezz0LStCuZyNpW2wT97f9pj3RADUn1L1MdqTq9Tm_b

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Validar configuracao
        run: |
          test -n "$APPS_SCRIPT_ID" || (echo "Script ID nao configurado" && exit 1)

      - name: Checkout Gestao de Obras
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: main
          path: gestao-obras

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install clasp
        run: npm install -g @google/clasp@3.4.1

      - name: Configurar autorizacao Google
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          test -n "$CLASPRC_JSON" || (echo "Secret CLASPRC_JSON nao configurado no fluxo_caixa" && exit 1)
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"

      - name: Configurar projeto Apps Script
        working-directory: gestao-obras/apps-script
        run: |
          cat > .clasp.json <<EOF
          {
            "scriptId": "$APPS_SCRIPT_ID",
            "rootDir": "",
            "scriptExtensions": [".js", ".gs"],
            "htmlExtensions": [".html"],
            "jsonExtensions": [".json"],
            "filePushOrder": [],
            "skipSubdirectories": false
          }
          EOF

      - name: Enviar backend para Apps Script
        working-directory: gestao-obras/apps-script
        run: clasp push --force

      - name: Atualizar Web App existente
        working-directory: gestao-obras/apps-script
        run: clasp update-deployment "$DEPLOYMENT_ID" --description "Deploy automatico Gestao de Obras ${{ github.sha }}"

      - name: Validar API publicada
        run: |
          URL="https://script.google.com/macros/s/$DEPLOYMENT_ID/exec?action=health"
          echo "Testando $URL"
          OK=0
          for TENTATIVA in 1 2 3 4 5 6; do
            BODY=$(curl --max-time 20 -L --fail --silent --show-error "$URL" || true)
            if echo "$BODY" | grep -q '"ok":true' && echo "$BODY" | grep -q '"schemaVersion":"4"'; then
              echo "$BODY"
              OK=1
              break
            fi
            echo "Health ainda nao respondeu corretamente. Tentativa $TENTATIVA/6."
            sleep 5
          done
          test "$OK" = "1"

      - name: Mostrar versao publicada
        working-directory: gestao-obras
        run: |
          echo "Gestao de Obras publicado."
          git rev-parse HEAD

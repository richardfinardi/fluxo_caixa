name: Apps Script Sync

on:
  push:
    branches:
      - main
    paths:
      - "apps-script/**"
      - ".github/workflows/apps-script-sync.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  push-to-apps-script:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps-script

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install clasp
        run: npm install -g @google/clasp@3.4.1

      - name: Configurar autorização Google
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          test -n "$CLASPRC_JSON" || (echo "Secret CLASPRC_JSON não configurado" && exit 1)
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"

      - name: Enviar para Apps Script
        run: clasp push --force
